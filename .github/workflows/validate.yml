name: 宠物包检查 / Validate pet package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装图像依赖 / Install image dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: 检查图集、文档与安装更新 / Validate package, docs, and updates
        run: |
          python scripts/check.py
          python scripts/check_docs.py
          python -m unittest discover -s tests -q
      - name: 检查 Work 图集 / Validate Work atlas
        run: python scripts/check_work.py
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载并核验扫描器 / Verify scanner download
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 90 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: 脱敏扫描历史 / Scan history with redaction
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner'
